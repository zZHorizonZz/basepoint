name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The contract tests run against the oldest and the newest server of each database that basepoint supports.
  # SQLite comes with its driver, so it is the same in both.
  build:
    name: build (${{ matrix.servers.name }} servers)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        servers:
          - name: newest
            postgres: postgres:17-alpine
            mysql: mysql:8.4
            sqlserver: mcr.microsoft.com/mssql/server:2022-latest
          - name: oldest
            postgres: postgres:13-alpine
            mysql: mysql:8.0.31
            sqlserver: mcr.microsoft.com/mssql/server:2017-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          # aquery comes from the GitHub packages of its repository.
          server-id: github-aquery
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Verify
        run: >-
          mvn --batch-mode --no-transfer-progress verify
          -Dbasepoint.it.postgres.image=${{ matrix.servers.postgres }}
          -Dbasepoint.it.mysql.image=${{ matrix.servers.mysql }}
          -Dbasepoint.it.sqlserver.image=${{ matrix.servers.sqlserver }}
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: tests (${{ matrix.servers.name }} servers)
          annotate_only: true
          detailed_summary: true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-${{ matrix.servers.name }}
          path: '**/target/surefire-reports/**'
